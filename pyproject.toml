[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wwpdb-validation"
version = "0.1.0"
description = "Read wwPDB validation reports completely and correctly"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["crystallography", "structural-biology", "pdb", "validation",
            "protein-data-bank", "electron-density"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.0"]
dev = ["pytest>=7", "pandas>=1.0"]

[project.urls]
Homepage = "https://github.com/Hiran001/wwpdb-validation"
Issues = "https://github.com/Hiran001/wwpdb-validation/issues"

[tool.setuptools.packages.find]
include = ["wwpdb_validation*"]
